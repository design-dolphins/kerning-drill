<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kerning Drill</title>
<style>
  :root{--ink:#17191d;--muted:#68707b;--line:#dfe3e8;--paper:#fff;--blue:#2878ef;--soft:#f5f7f9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif}button,select{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:28px 32px 64px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-weight:650;font-size:19px;letter-spacing:-.02em}.sub{font-size:13px;color:var(--muted);margin-top:4px}.eyebrow{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.1em;text-transform:uppercase}.home{padding-top:10vh}.home h1{font-size:clamp(40px,6vw,76px);letter-spacing:-.075em;line-height:1.03;margin:22px 0}.lead{font-size:19px;line-height:1.7;max-width:620px;color:#3d434c}.levels{margin-top:45px}.levels h2{font-size:14px;margin:0 0 14px}.level-row{display:flex;flex-wrap:wrap;gap:8px}.choice,.control{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 15px;color:#343942}.choice.active{background:var(--ink);border-color:var(--ink);color:white}.primary{background:var(--ink);border:0;border-radius:8px;padding:13px 18px;color:white;font-weight:600;margin-top:15px}.hint-card{margin-top:56px;border-top:1px solid var(--line);padding-top:24px;max-width:620px}.hint-card h3{font-size:14px;margin:0 0 12px}.hint-card strong{font-size:28px;letter-spacing:-.04em}.hint-card p{line-height:1.7;color:var(--muted)}.drill-head{display:flex;justify-content:space-between;gap:24px;margin-top:46px;align-items:flex-end}.drill-head h1{font-size:23px;margin:6px 0 0;letter-spacing:-.04em}.toolbar{display:flex;align-items:center;gap:9px}.toolbar select{border:1px solid var(--line);border-radius:7px;padding:8px;background:white}.stage{margin-top:32px;min-height:330px;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}.word{display:flex;align-items:baseline;white-space:pre;line-height:1;font-size:clamp(62px,12vw,130px);font-family:Arial,"Helvetica Neue",sans-serif;font-weight:500;letter-spacing:0}.glyph{display:inline-block;position:relative;user-select:none;cursor:ew-resize}.glyph.selected:after{content:"";position:absolute;top:-.15em;bottom:-.2em;width:2px;right:calc(var(--kern) * 1em);background:var(--blue);box-shadow:0 0 0 1px #fff}.glyph.selected:before{content:"";position:absolute;right:calc(var(--kern) * 1em - 4px);bottom:-.27em;width:8px;height:8px;background:var(--blue);border-radius:50%}.readout{margin-top:16px;text-align:center;color:var(--muted);font-size:13px;min-height:22px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:24px}.shortcut{font-size:13px;color:var(--muted)}.assessment{margin-top:38px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.panel{border-top:1px solid var(--line);padding-top:18px}.panel h2{font-size:14px;margin:0 0 14px}.accuracy{font-size:48px;letter-spacing:-.06em;margin-bottom:13px}.pairs{display:grid;gap:8px}.pair{display:flex;justify-content:space-between;border-bottom:1px solid #eef0f2;padding:10px 0;font-size:14px}.explain{line-height:1.75;color:#444b54}.compare{border:1px solid var(--line);border-radius:13px;margin-top:28px;padding:28px;overflow:hidden}.compare h2{font-size:15px;margin:0 0 20px}.overlay-stage{height:210px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.overlay-stage .word{position:absolute;font-size:clamp(53px,10vw,110px);transform-origin:left center}.reference{color:var(--blue);opacity:.7}.compare-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--blue);margin:16px 0}.score-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}.back{border:0;background:transparent;color:var(--muted);padding:0}.notice{font-size:13px;color:var(--muted);margin-top:14px}@media(max-width:640px){.shell{padding:21px 18px 42px}.home{padding-top:7vh}.bottom,.drill-head{align-items:flex-start;flex-direction:column}.assessment{grid-template-columns:1fr}.stage{min-height:250px}.shortcut{line-height:1.6}}
</style>
</head>
<body><main class="shell" id="app"></main>
<script>
const bank={
 beginner:['AWE','AXE','BOX','CUP','DAY','EYE','FOX','GEM','HAT','INK','JAR','KEY','LOW','MAP','NOD','OAK','RED','SUN','TOY','VOW'],
 intermediate:['TYPE','LOGO','BOOK','MINT','JAZZ','FORK','WAVE','CLOUD','SILK','BROWN','PIXEL','QUIET','BRAVE','HONEY','FRESH','WATER','MUSIC','NIGHT','PLANT','CHAIR'],
 advanced:['TYPOGRAPHY','ILLUSTRATOR','INFORMATION','COMMUNICATION','BLACKBIRD','WONDERFUL','BOOKSTORE','MOUNTAINS','JOURNEY','SUNFLOWER','NOTEBOOK','HANDMADE','BLUEPRINT','CINEMATIC','LANGUAGE','NEWSPAPER','WORKSPACE','GATHERING','WHISPERED','STARLIGHT'],
 expert:['The Art Book','Good Sunny Day','My New Bag','The Red Cup','One Blue Sky','Small Brown Dog','The Old Map','Your Key Ring','Fresh Apple Pie','Warm Winter Coat','The Bus Stop','Our Family Trip','Sunday Movie Night','Yellow City Taxi','The Corner Store','Quiet Reading Room','Little Paper Boat','The Open Window','Happy Summer Song','New York City']
};
const meta={random:['ランダム','すべての難易度から出題'],beginner:['初級','3文字の実在単語'],intermediate:['中級','1単語'],advanced:['上級','長い1単語'],expert:['超上級','日常的な3単語']};
const reasons={A:'斜線の内側には三角形の余白が生まれます。見た目の白場が均等になるように詰めます。',V:'斜線の文字は接点より上に空白が広がります。隣の字形との白場を見ます。',W:'幅の広い斜線は、隣との距離が大きく見えやすい形です。',T:'横棒が左右に空白をつくります。次の文字との白場を確かめます。',O:'丸い文字は矩形より余白が小さく感じやすいため、輪郭同士の距離で判断します。'};
let level='random',word='',values=[],selected=0,screen='home',drag=null,result=null,compare=0,font='Arial',customTargets={};
const app=document.getElementById('app');
try{customTargets=JSON.parse(localStorage.getItem('kerning-drill-custom-targets')||'{}')}catch(e){}
function targetFor(a,b){if(a===' '||b===' ')return 70;if('AVWY'.includes(a)&&'AVWY'.includes(b))return-58;if(a==='T')return-42;if('AVWY'.includes(a)||'AVWY'.includes(b))return-28;if('OQC'.includes(a)||'OQC'.includes(b))return-14;return-8}
function fixed(i){return word[i]===' '||word[i+1]===' '}
function firstEditable(){return values.findIndex((_,i)=>!fixed(i))}
function choose(){const key=level==='random'?['beginner','intermediate','advanced','expert'][Math.floor(Math.random()*4)]:level;const list=bank[key];let next=list[Math.floor(Math.random()*list.length)];if(list.length>1&&next===word)next=list[(list.indexOf(next)+1)%list.length];word=next;values=Array.from({length:Math.max(0,[...word].length-1)},(_,i)=>fixed(i)?targetFor(word[i],word[i+1]):0);selected=Math.max(0,firstEditable());result=null;compare=0;screen='drill';render()}
function kernWord(arr,klass=''){let html='';[...word].forEach((ch,i)=>{const kern=i<arr.length?arr[i]/1000:0;html+='<span class="glyph '+(i===selected&&klass==='active'&&!fixed(i)?'selected':'')+'" data-i="'+i+'" style="margin-right:'+kern+'em;--kern:'+kern+'em">'+(ch===' '?'&nbsp;':ch)+'</span>'});return html}
function score(){const targets=(customTargets[word]?.length===values.length?customTargets[word]:values.map((_,i)=>targetFor(word[i],word[i+1])));const error=values.reduce((n,v,i)=>n+(fixed(i)?0:Math.abs(v-targets[i])),0);const editable=values.filter((_,i)=>!fixed(i)).length||1;const accuracy=Math.max(0,100-error/(editable*1.2));result={targets,accuracy};screen='score';render()}
function render(){if(screen==='home'){app.innerHTML='<header class="top"><div><div class="brand">Kerning Drill</div><div class="sub">Illustrator practice · 1/1000 em</div></div></header><section class="home"><div class="eyebrow">Daily typography practice</div><h1>目で測る。<br>余白を整える。</h1><p class="lead">Illustratorの感覚で、文字間の見え方を鍛える5分間のドリル。正解ではなく、字形のつくる余白を観察します。</p><div class="levels"><h2>難易度を選ぶ</h2><div class="level-row">'+Object.entries(meta).map(([k,v])=>'<button class="choice '+(level===k?'active':'')+'" data-level="'+k+'">'+v[0]+'</button>').join('')+'</div><button class="primary" id="start">'+meta[level][0]+'で開始　⌘ ↵</button></div><div class="hint-card"><h3>今日のフォーカス</h3><strong>AV</strong><p>斜線の間には、実際の距離より大きく見える三角形の空白があります。</p></div></section>';document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;render()});document.getElementById('start').onclick=choose;return}
const body='<header class="top"><div><button class="back" id="home">← ホーム</button><div class="brand" style="margin-top:8px">Kerning Drill</div></div><div class="sub">Illustrator practice · 1/1000 em</div></header>';
if(screen==='drill'){app.innerHTML=body+'<section class="drill-head"><div><div class="eyebrow">'+meta[level][0]+' · '+meta[level][1]+'</div><h1>文字間を調整する</h1></div><div class="toolbar"><label class="sub">Font</label><select id="font"><option>Arial</option><option>Helvetica</option><option>Inter</option><option>Verdana</option></select></div></section><div class="stage"><div id="word" class="word" style="font-family:'+font+'">'+kernWord(values,'active')+'</div></div><div class="readout">'+word[selected]+' / '+word[selected+1]+'　 <b>'+values[selected]+'</b> / 1000 em</div><div class="bottom"><div class="shortcut">← →：カーソル移動　　Option + ← →：カーニング調整　　ドラッグ：直接調整　　単語間スペースは固定</div><button class="primary" id="check">採点する</button></div>';document.getElementById('home').onclick=()=>{screen='home';render()};document.getElementById('font').value=font;document.getElementById('font').onchange=e=>{font=e.target.value;render()};document.getElementById('check').onclick=score;bindWord();return}
const targets=result.targets;const blended=values.map((v,i)=>Math.round(v+(targets[i]-v)*compare));app.innerHTML=body+'<section class="drill-head"><div><div class="eyebrow">結果</div><h1>'+word+'</h1></div><button class="control" id="again">次の問題</button></section><section class="assessment"><div class="panel"><h2>Accuracy</h2><div class="accuracy">'+result.accuracy.toFixed(1)+'%</div><div class="pairs">'+values.map((v,i)=>fixed(i)?'':'<div class="pair"><b>'+word[i]+word[i+1]+'</b><span>あなた '+v+'　正解 '+targets[i]+'　差分 '+(v-targets[i]>=0?'+':'')+(v-targets[i])+'</span></div>').join('')+'</div></div><div class="panel"><h2>なぜ調整する？</h2><p class="explain">'+(reasons[word[selected]]||reasons[word[selected+1]]||'文字の輪郭がつくる白場は、同じ数値の文字間でも均一には見えません。前後の字形をひとつの余白として観察します。')+'</p><p class="explain">基準は数値ではなく、文字列全体のリズムです。隣り合う余白の大きさと形を比べてください。</p></div></section><section class="compare"><h2>ユーザーと正解を比較</h2><div class="overlay-stage"><div class="word reference" style="font-family:'+font+'">'+kernWord(targets)+'</div><div class="word" style="font-family:'+font+';opacity:'+(1-compare*.45)+'">'+kernWord(blended)+'</div></div><div class="compare-labels"><span>ユーザー（黒）</span><span>正解（青）</span></div><input id="compare" type="range" min="0" max="1" step="0.01" value="'+compare+'"><div class="score-actions"><button class="primary" id="answer">答えの位置まで見る</button><button class="control" id="save-answer">この回答を正解にする</button><button class="control" id="retry">もう一度この問題</button></div><div class="notice">青と黒は左端を揃えています。ずれた文字間だけを確認できます。</div></section>';document.getElementById('home').onclick=()=>{screen='home';render()};document.getElementById('again').onclick=choose;document.getElementById('retry').onclick=()=>{screen='drill';render()};document.getElementById('compare').oninput=e=>{compare=+e.target.value;render()};document.getElementById('save-answer').onclick=()=>{customTargets[word]=[...values];localStorage.setItem('kerning-drill-custom-targets',JSON.stringify(customTargets));result={targets:[...values],accuracy:100};render()};document.getElementById('answer').onclick=()=>{let t=0;const timer=setInterval(()=>{t+=.05;compare=Math.min(1,t);render();if(t>=1)clearInterval(timer)},20)} }
function bindWord(){const el=document.getElementById('word');el.querySelectorAll('.glyph').forEach(g=>{g.onpointerdown=e=>{const i=+g.dataset.i;if(i>=values.length||fixed(i))return;selected=i;drag={x:e.clientX,v:values[i]};g.setPointerCapture(e.pointerId);render()}});window.onpointermove=e=>{if(!drag)return;values[selected]=Math.max(-180,Math.min(160,Math.round(drag.v+(e.clientX-drag.x)/.13)));render()};window.onpointerup=()=>drag=null}
window.addEventListener('keydown',e=>{if(screen==='home'&&(e.key==='Enter')){choose();return}if(screen!=='drill')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();let dir=e.key==='ArrowRight'?1:-1;if(e.altKey){values[selected]=Math.max(-180,Math.min(160,values[selected]+dir*10))}else{let next=selected+dir;while(next>=0&&next<values.length&&fixed(next))next+=dir;selected=Math.max(0,Math.min(values.length-1,next))}render()}});render();
</script></body></html>
